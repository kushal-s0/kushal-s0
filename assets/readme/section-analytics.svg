<svg xmlns="http://www.w3.org/2000/svg" width="900" height="76" viewBox="0 0 900 76" role="img" aria-label="GitHub Analytics"><title>GitHub Analytics</title><style>
.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .9s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.up,.fade,.blink{animation:none}}
</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern></defs><defs><clipPath id="pclip"><rect width="900" height="76" rx="14"/></clipPath><radialGradient id="pglow" cx="0" cy=".5" r="70%"><stop offset="0" stop-color="#A78BFA" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#pclip)"><rect width="900" height="76" fill="#0A101F"/><rect width="900" height="76" fill="url(#grid)"/><rect width="900" height="76" fill="url(#pglow)"/></g><rect x=".5" y=".5" width="899" height="75" rx="13.5" fill="none" stroke="#A78BFA" stroke-opacity=".25"/><defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0.00" stop-color="#A78BFA"/><stop offset="0.50" stop-color="#22D3EE"/><stop offset="1.00" stop-color="#0A101F"/></linearGradient><linearGradient id="barh" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><clipPath id="barc"><rect x="88" y="60" width="220" height="3" rx="1.5"/></clipPath></defs><rect x="88" y="60" width="220" height="3" rx="1.5" fill="url(#bar)"/><g clip-path="url(#barc)"><rect x="-92" y="60" width="180" height="3" fill="url(#barh)" opacity=".6"><animate attributeName="x" from="-92" to="308" dur="5s" repeatCount="indefinite"/></rect></g><g class="up"><rect x="22" y="19" width="50" height="38" rx="10" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".5"/><text x="47" y="44" font-size="16" fill="#A78BFA" class="m" font-weight="700" text-anchor="middle" >06</text><text x="88" y="47" font-size="25" fill="#F8FAFC" class="s" font-weight="700" >GitHub Analytics</text></g><g class="fade" style="animation-delay:0.35s"><text x="858" y="44" font-size="13" fill="#64748B" class="m" text-anchor="end" >$ gh stats kushal-s0</text><rect class="blink" x="866" y="31" width="9" height="17" rx="1" fill="#A78BFA"/></g></svg>
