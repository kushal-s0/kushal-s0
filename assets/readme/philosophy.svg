<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-label="An AI feature nobody trusts is just an expensive animation. Build the boring reliability first."><title>An AI feature nobody trusts is just an expensive animation. Build the boring reliability first.</title><style>
.m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .9s ease both}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.up,.fade,.blink{animation:none}}
</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern><linearGradient id="q" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><linearGradient id="qh" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs><defs><clipPath id="pclip"><rect width="900" height="176" rx="16"/></clipPath><radialGradient id="pglow" cx=".5" cy="1" r="70%"><stop offset="0" stop-color="#A78BFA" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#pclip)"><rect width="900" height="176" fill="#0A101F"/><rect width="900" height="176" fill="url(#grid)"/><rect width="900" height="176" fill="url(#pglow)"/></g><rect x=".5" y=".5" width="899" height="175" rx="15.5" fill="none" stroke="#A78BFA" stroke-opacity=".25"/><text x="46" y="112" font-size="120" fill="url(#q)" class="s" font-weight="800" opacity=".35">“</text><text x="854" y="190" font-size="120" fill="url(#q)" class="s" font-weight="800" text-anchor="end" opacity=".35">”</text><text x="450.0" y="44" font-size="11" fill="#64748B" class="m" font-weight="700" text-anchor="middle" letter-spacing="2">// DEVELOPER PHILOSOPHY</text><g class="up"><text x="450.0" y="92" font-size="23" fill="#F8FAFC" class="s" font-weight="600" text-anchor="middle" >An AI feature nobody trusts is just an expensive animation.</text></g><g class="up" style="animation-delay:0.35s"><text x="450.0" y="130" font-size="23" fill="url(#qh)" class="s" font-weight="800" text-anchor="middle" >Build the boring reliability first.</text></g></svg>
